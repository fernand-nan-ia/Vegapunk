[project]
name = "vegapunk"
version = "0.1.0"
description = "Telegram knowledge bot: links de YouTube/TikTok/Instagram viram memória em Markdown para o Claude Code."
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21.0",
  "anthropic>=1.0",
  "pydantic>=2.0",
  "yt-dlp>=2025.1.1",
  "faster-whisper>=1.1.0",
  "python-dotenv>=1.0",
  "python-slugify>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
