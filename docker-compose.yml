services:
  vegapunk:
    build: .
    env_file: .env
    # roda como seu usuário para os arquivos do vault/git não ficarem como root
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/app                       # repo inteiro: punk_records/, data/, .git
      - ./whisper-cache:/app/whisper-cache
      - ~/.gitconfig:/etc/gitconfig:ro
      # descomente para push automático via SSH:
      # - ~/.ssh:/home/vegapunk/.ssh:ro
    environment:
      - HOME=/tmp
      - PYTHONPATH=/app/src
      - VEGAPUNK_ROOT=/app
    stop_grace_period: 30s          # deixa o bot fechar tarefas em voo; sem isso o Docker mata em 10 s (exit 137)
    restart: unless-stopped
